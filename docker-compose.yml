services:
  expertise-ai:
    build:
      context: .
    container_name: expertise-ai
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - expertise_ai_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  expertise_ai_data:
